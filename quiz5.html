<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progressive Era — Multiple Choice Mastery</title><style>*{box-sizing:border-box}body{margin:0;background:#f1e6cd;color:#2b2116;font-family:Georgia,serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent,transparent 27px,rgba(120,90,30,.06) 28px)}.wrap{max-width:850px;margin:auto;padding:30px 18px 70px;position:relative}.head{text-align:center;border-bottom:4px double #7c5a13;padding-bottom:18px;margin-bottom:22px}.eyebrow{font:12px monospace;letter-spacing:3px;text-transform:uppercase;color:#7c5a13}h1{font-size:clamp(28px,5vw,44px);margin:7px 0}.sub{font-style:italic;color:#55452f}.deck,.card,.panel{background:#fffaf0b8;border:1px solid #c9b587;border-radius:10px}.deck{background:#e7d8b4;padding:14px 18px;margin-bottom:22px}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:13px monospace;color:#55452f;margin-bottom:10px}.stats strong{color:#2b2116}.bar{height:13px;background:#fffdf6;border:1px solid #c9b587;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#a97c1f,#3f5d3a);transition:.3s}.card{padding:25px 23px}.tag{font:11px monospace;letter-spacing:2px;text-transform:uppercase;color:#7c5a13;margin-bottom:12px}.def{font-size:17px;line-height:1.55;margin-bottom:20px}.opts{display:grid;gap:10px}.opt{font:15px Georgia,serif;text-align:left;padding:13px 15px;border:2px solid #c9b587;border-radius:8px;background:#fffdf6;color:#2b2116;cursor:pointer}.opt:hover:not(:disabled){border-color:#a97c1f;background:#e7d8b4}.opt:disabled{cursor:default}.correct{background:#dbe7d1!important;border-color:#3f5d3a!important;color:#3f5d3a!important;font-weight:bold}.wrong{background:#f0d9d2!important;border-color:#8f3a2e!important;color:#8f3a2e!important}.feedback{min-height:24px;margin-top:16px;color:#55452f;font-style:italic;font-size:14px;line-height:1.45}.actions{text-align:right;margin-top:15px}.next,.main{border:1px solid #7c5a13;background:#a97c1f;color:white;padding:10px 18px;border-radius:6px;font:600 14px Georgia,serif;cursor:pointer}.next{opacity:0;pointer-events:none}.next.show{opacity:1;pointer-events:auto}.panel{text-align:center;padding:35px 22px}.panel h2{font-size:28px;margin:0 0 10px}.panel p{color:#55452f;line-height:1.5}.missed{text-align:left;max-width:520px;margin:18px auto;padding:12px 15px;border:1px dashed #c9b587;border-radius:8px;font-size:13px}.missed div{padding:5px 0;border-bottom:1px solid #c9b587}.missed div:last-child{border:0}footer{text-align:center;color:#55452f;font-size:12px;font-style:italic;margin-top:14px}@media(max-width:600px){.wrap{padding:20px 12px 60px}.card{padding:21px 15px}.def{font-size:16px}}</style></head><body><div class="wrap"><header class="head"><div class="eyebrow">U.S. History · Progressive Era</div><h1>Progressive Era Mastery</h1><div class="sub">Multiple choice review — master every key term by getting it right twice.</div></header><div class="deck"><div class="stats"><span>Mastered: <strong id="mastered">0</strong> / <strong id="total">0</strong></span><span>Round: <strong id="roundEl">1</strong></span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div id="app"></div><footer>Correct answers count toward mastery. A missed term resets its progress and returns in a later round.</footer></div><script>const DATA=[{"id": 1, "term": "Progressive Movement", "definition": "Goal was to fix the problems created in the Gilded Age. Wanted government to listen to citizens, labor reforms, and social reforms."}, {"id": 2, "term": "Scientific Management", "definition": "Progressives wanted to increase productivity and efficiency with science."}, {"id": 3, "term": "Muckrakers", "definition": "Investigative journalists who exposed the problems of the Gilded Age. They also provided solutions to the problems."}, {"id": 4, "term": "16th Amendment", "definition": "Ratified in 1913; allows Congress to impose a graduated income tax. The more you make, the more you pay."}, {"id": 5, "term": "Jacob Riis", "definition": "A muckraker who used photography and writing to expose the living and working conditions of those in poverty."}, {"id": 6, "term": "Australian (Secret) Ballot", "definition": "When voters mark their choices in private. This idea was pushed by the Populist Party and adopted by Progressives."}, {"id": 7, "term": "Direct Primary", "definition": "A Progressive reform when voters choose who will run for office, not the party or political machine. Goal was to end corruption in politics."}, {"id": 8, "term": "Robert La Follette", "definition": "Progressive Governor and Senator from Wisconsin. Led Wisconsin as the first state to adopt many Progressive reforms. Many aimed at giving citizens a bigger role in government."}, {"id": 9, "term": "17th Amendment", "definition": "Allowed the direct election of U.S. Senators. Goal was to make government more responsive to citizens instead of monopolies/trusts and political machines."}, {"id": 10, "term": "Initiative", "definition": "Voter-driven petition to change a law. Led by progressive reforms to make government more responsive to citizens."}, {"id": 11, "term": "Referendum", "definition": "A public vote on proposed legislation. A progressive reform aimed at giving voters a bigger voice in government."}, {"id": 12, "term": "Recall", "definition": "Allows voters the opportunity to remove an elected official by having another election before their term is up. Must be started by voters through petitions."}, {"id": 13, "term": "Social Welfare", "definition": "Things that impact the good of the people. Often refers to services provided by the government for the people."}, {"id": 14, "term": "Municipal Reform", "definition": "Changing city government so it is more efficient, honest, and responsive."}, {"id": 15, "term": "Teddy Roosevelt", "definition": "Republican Progressive Era President 1901–1909. Also ran for the Bull Moose Party in 1912, helping split the Republican vote. Known for trust busting, conservation, and Big Stick Policy. Considered the first modern president due to his use of the media."}, {"id": 16, "term": "Square Deal", "definition": "Teddy Roosevelt's domestic programs. Goals included conservation, regulating big business, and protecting consumers."}, {"id": 17, "term": "Trust Busting", "definition": "Teddy Roosevelt, Howard Taft, and Woodrow Wilson used the Sherman Anti-Trust Act to break up trusts/monopolies because they discouraged competition and hurt consumers."}, {"id": 18, "term": "Elkins Act", "definition": "A federal law allowing the Interstate Commerce Commission the power to fine railroads that gave unfair rebates or discriminated with unfair pricing."}, {"id": 19, "term": "The Jungle", "definition": "Muckraking book written by Upton Sinclair. The fictional book depicts actual conditions inside meatpacking plants and made people aware of unsanitary conditions."}, {"id": 20, "term": "Pure Food and Drug Act (1906)", "definition": "Requires truth in labeling of goods sold in the USA. Companies could no longer claim their product did things it did not do."}, {"id": 21, "term": "Meat Inspection Act (1906)", "definition": "Created as a reaction to The Jungle. Required sanitary conditions in meatpacking facilities."}, {"id": 22, "term": "Conservation", "definition": "Preserving or protecting something with the goal of keeping it in its natural state."}, {"id": 23, "term": "William Howard Taft", "definition": "President Roosevelt's hand-picked successor. Republican President 1909–1913. Angered Teddy Roosevelt and other Republicans because he did not copy Teddy's presidency and decreased conservation efforts. Only former president to become Chief Justice of the Supreme Court."}, {"id": 24, "term": "18th Amendment", "definition": "Ratified in 1919; prohibited commercial manufacture, sale, and consumption of alcoholic beverages."}, {"id": 25, "term": "Payne-Aldrich Tariff", "definition": "Passed during Taft's presidency. Increased tariffs, which upset members of his party and led to Taft losing Teddy Roosevelt's support."}, {"id": 26, "term": "Eugene V. Debs", "definition": "American union leader and head of the Socialist Party. Ran for President five times as a Socialist. Wanted the USA to adopt socialism."}, {"id": 27, "term": "Bull Moose Party", "definition": "Political party started by Teddy Roosevelt for the 1912 election because he did not agree with Howard Taft’s policies."}, {"id": 28, "term": "Underwood Tariff", "definition": "Lowered tariffs from 40% to 25%. Many American businesses opposed the change. Progressives approved of the change."}, {"id": 29, "term": "Clayton Anti-Trust Act", "definition": "Federal law aimed at increasing the government's ability to regulate, prosecute, and break up trusts/monopolies because they reduced competition."}, {"id": 30, "term": "Federal Trade Commission", "definition": "Federal agency created to protect consumers and end monopolies. Allowed for government oversight of business."}, {"id": 31, "term": "Niagara Movement", "definition": "Civil Rights organization founded by W.E.B. Du Bois. Called for immediate end to racial segregation and disenfranchisement. Disagreed with Booker T. Washington about getting rights slowly."}, {"id": 32, "term": "NAACP", "definition": "National Association for the Advancement of Colored People started in 1909. Started to gain equal rights for all African Americans. Uses the court system to ensure constitutional rights are upheld."}, {"id": 33, "term": "National Women Suffrage Association", "definition": "Women's rights movement. Goal was to get women the right to vote. Led by Susan B. Anthony, Carrie Chapman Catt, and Anna Howard Shaw."}, {"id": 34, "term": "19th Amendment", "definition": "Prohibits any citizen of the U.S. from being denied the right to vote based on sex. This gave women the right to vote."}, {"id": 35, "term": "Federal Reserve", "definition": "Created to be independent from the government to prevent political influence. The board controls the amount of money in circulation and interest rates on loans."}, {"id": 36, "term": "League of Women Voters", "definition": "Started by suffragist Carrie Chapman Catt as a result of women getting the right to vote. Goal was to encourage women to vote and support issues important to women."}],TARGET=2,mastery={},misses={};DATA.forEach(x=>{mastery[x.id]=0;misses[x.id]=0});let q=[],i=0,round=1,roundMiss=[];function sh(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function count(){return Object.values(mastery).filter(v=>v>=TARGET).length}function update(){mastered.textContent=count();total.textContent=DATA.length;roundEl.textContent=round;fill.style.width=count()/DATA.length*100+"%"}function start(){q=sh(DATA.filter(x=>mastery[x.id]<TARGET));i=0;roundMiss=[];update();q.length?show():complete()}function show(){if(i>=q.length)return summary();let x=q[i],choices=sh([x.term,...sh(DATA.filter(y=>y.term!==x.term)).slice(0,3).map(y=>y.term)]);app.innerHTML="";let c=document.createElement("section");c.className="card";c.innerHTML=`<div class="tag">Term ${i+1} of ${q.length} · mastery ${mastery[x.id]}/${TARGET}</div><div class="def">${x.definition}</div>`;let os=document.createElement("div");os.className="opts";let f=document.createElement("div");f.className="feedback";let n=document.createElement("button");n.className="next";n.textContent="Next →";n.onclick=()=>{i++;show()};choices.forEach(ch=>{let b=document.createElement("button");b.className="opt";b.textContent=ch;b.onclick=()=>{[...os.children].forEach(z=>z.disabled=true);if(ch===x.term){b.classList.add("correct");mastery[x.id]=Math.min(TARGET,mastery[x.id]+1);f.textContent=mastery[x.id]>=TARGET?"✓ Correct — this term is mastered.":"✓ Correct — get it right one more time to master it."}else{b.classList.add("wrong");[...os.children].find(z=>z.textContent===x.term).classList.add("correct");mastery[x.id]=0;misses[x.id]++;if(!roundMiss.includes(x.id))roundMiss.push(x.id);f.textContent="✗ Not quite. Correct answer: "+x.term}update();n.classList.add("show")};os.appendChild(b)});c.append(os,f);let a=document.createElement("div");a.className="actions";a.appendChild(n);c.appendChild(a);app.appendChild(c)}function summary(){let p=document.createElement("div");p.className="panel";let list=roundMiss.map(id=>DATA.find(x=>x.id===id).term).map(t=>`<div>${t}</div>`).join("");p.innerHTML=`<h2>Round ${round} complete!</h2><p>${roundMiss.length?roundMiss.length+" term(s) need another try.":"Excellent — every term in this round was correct."}</p>${list?`<div class="missed">${list}</div>`:""}`;let b=document.createElement("button");b.className="main";b.textContent="Continue →";b.onclick=()=>{round++;start()};p.appendChild(b);app.innerHTML="";app.appendChild(p);update()}function complete(){let p=document.createElement("div");p.className="panel";let m=Object.values(misses).reduce((a,b)=>a+b,0);p.innerHTML=`<h2>All ${DATA.length} terms mastered!</h2><p>You got every Progressive Era term correct twice.</p><p>Total missed answers: ${m}</p>`;let b=document.createElement("button");b.className="main";b.textContent="Start Over";b.onclick=()=>{DATA.forEach(x=>{mastery[x.id]=0;misses[x.id]=0});round=1;start()};p.appendChild(b);app.innerHTML="";app.appendChild(p);update()}start();</script></body></html>
