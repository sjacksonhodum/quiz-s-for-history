  {name:'Tariffs', terms:[['ga','Tariff'],['prog','Payne-Aldrich Tariff'],['prog','Underwood Tariff'],['gd','Hawley-Smoot Tariff']],
   tip:'<b>Tariff</b> = a tax on imports. <b>Payne-Aldrich</b> (Taft) <i>raised</i> tariffs and cost Taft Roosevelt’s support. <b>Underwood</b> (Wilson) <i>lowered</i> them from 40% to 25%. <b>Hawley-Smoot</b> (Hoover) <i>raised</i> them and helped spread the Depression worldwide.'},
  {name:'The Progressive presidents', terms:[['prog','Teddy Roosevelt'],['prog','Square Deal'],['prog','William Howard Taft'],['prog','Bull Moose Party'],['ww1','Woodrow Wilson']],
   tip:'<b>Roosevelt</b> (1901–09): the <b>Square Deal</b>, trust busting, conservation. <b>Taft</b> (1909–13): Roosevelt’s pick, but cut back conservation and angered him. In 1912 Roosevelt ran with the <b>Bull Moose Party</b>, which split the Republican vote. <b>Wilson</b> (1913–21) led through WWI.'},
  {name:'Women’s suffrage', terms:[['ga','National American Woman Suffrage Association'],['prog','19th Amendment'],['prog','League of Women Voters']],
   tip:'<b>NAWSA</b> (Anthony, Catt, Shaw) = fought for the vote → the <b>19th Amendment</b> won it → Catt then started the <b>League of Women Voters</b> to get women voting.'},
  {name:'Why the U.S. entered WWI', terms:[['ww1','Neutrality'],['ww1','Unrestricted Submarine Warfare'],['ww1','Lusitania'],['ww1','Sussex Pledge'],['ww1','Zimmerman Note']],
   tip:'The U.S. starts <b>neutral</b> → Germany’s <b>unrestricted submarine warfare</b> sinks the <b>Lusitania</b> → the <b>Sussex Pledge</b> (1916) promises to stop → Germany restarts it, and the <b>Zimmerman Note</b> (1917) asks Mexico to attack the U.S. → the U.S. joins the war.'},
  {name:'Free speech in wartime', terms:[['ww1','Civil Liberties'],['ww1','Espionage Act'],['ww1','Sedition Act'],['ww1','Schenck v. United States']],
   tip:'<b>Espionage Act</b> = no interfering with the military or the draft, and no helping enemies. <b>Sedition Act</b> = no negative <i>speech</i> about the government. <b>Schenck</b> = the Supreme Court upheld limits on free speech in wartime. Together they restricted <b>civil liberties</b>.'},
  {name:'The two sides', terms:[['ww1','Allied Powers'],['ww1','Central Powers'],['ww1','Alliances']],
   tip:'<b>Allies</b> = Great Britain, France, Italy, Russia (the U.S. joined in 1917). <b>Central Powers</b> = Germany, Austria-Hungary, the Ottoman Empire, the ones in the <i>center</i> of Europe.'},
  {name:'Causes of WWI (M.A.I.N.)', terms:[['ww1','Militarism'],['ww1','Alliances'],['ww1','Imperialism'],['ww1','Nationalism']],
   tip:'<b>M</b>ilitarism (build up the military), <b>A</b>lliances (agreements that dragged countries in), <b>I</b>mperialism (one country controlling another), <b>N</b>ationalism (extreme national pride).'},
  {name:'Ending the war', terms:[['ww1','14 Points'],['ww1','Treaty of Versailles'],['ww1','League of Nations'],['ww1','Big Four'],['ww1','Henry Cabot Lodge']],
   tip:'The <b>14 Points</b> = Wilson’s plan, <i>not</i> adopted. The <b>Big Four</b> wrote the real treaty, <b>Versailles</b>, which blamed Germany and created the <b>League of Nations</b>. <b>Lodge</b> led the Senate fight against it, so the U.S. never joined the League.'},
  {name:'The home front', terms:[['ww1','Selective Service Act'],['ww1','War Industries Board'],['ww1','Food Administration'],['ww1','Propaganda']],
   tip:'<b>Selective Service</b> = the draft (men 18–45). <b>War Industries Board</b> = ran factories, materials and supplies. <b>Food Administration</b> = food rationing and prices. <b>Propaganda</b> = one-sided messages to win support for the war.'},
  {name:'After the war: fear of communism', terms:[['ww1','Russian Revolution'],['ww1','First Red Scare'],['ww1','Palmer Raids']],
   tip:'The <b>Russian Revolution</b> (communists take over) → the <b>First Red Scare</b> (Americans fear communism and immigrants) → the <b>Palmer Raids</b> (1919–20 arrests and deportations of suspected radicals).'},
  {name:'The crash', terms:[['gd','Buying on Margin'],['gd','Black Tuesday'],['gd','Great Depression'],['gd','Gross National Product'],['gd','Income Distribution']],
   tip:'<b>Buying on margin</b> = buying stock with borrowed money. When prices fell on <b>Black Tuesday</b> (1929) the market crashed, which marked the start of the <b>Great Depression</b> (1929–1941). <b>GNP</b> = the yearly total of goods and services. <b>Income distribution</b> = how money is spread across society.'},
  {name:'Hoover vs. FDR', terms:[['gd','Herbert Hoover'],['gd','Rugged Individualism'],['gd','Franklin D. Roosevelt (FDR)'],['gd','New Deal'],['gd','Keynesian Economics']],
   tip:'<b>Hoover</b> = little government help, <b>rugged individualism</b> (get yourself out through hard work), "trickle down." <b>FDR</b> = the <b>New Deal</b> (relief, reform, recovery), a bigger federal government, and deficit spending, which is the <b>Keynesian</b> idea.'},
  {name:'The alphabet agencies', terms:[['gd','Civilian Conservation Corps (CCC)'],['gd','Works Progress Administration (WPA)'],['gd','TVA'],['gd','National Recovery Administration'],['gd','Securities & Exchange Commission'],['gd','FDIC'],['gd','Social Security Administration']],
   tip:'<b>CCC</b> = young men working on parks and public land. <b>WPA</b> = Second New Deal jobs building roads, schools and airports, plus jobs for artists and writers. <b>TVA</b> = dams and hydroelectric power. <b>NRA</b> = controlled prices and wages, later ruled unconstitutional. <b>SEC</b> = watches the stock market. <b>FDIC</b> = insures bank deposits. <b>Social Security</b> = pensions for people 65 and older.'},
  {name:'Fixing the banks', terms:[['gd','Bank Holiday'],['gd','FDIC'],['gd','Glass-Steagall Act'],['gd','Securities & Exchange Commission']],
   tip:'<b>Bank Holiday</b> = FDR’s first act: close every bank and inspect it. <b>FDIC</b> = insures your deposits (then $5,000). <b>Glass-Steagall</b> = commercial banks can’t be in the stock and bond business. <b>SEC</b> = regulates stockbrokers and the market.'},
  {name:'Three Depression-era amendments', terms:[['gd','20th Amendment'],['gd','21st Amendment'],['gd','22nd Amendment']],
   tip:'<b>20th</b> = shorter "lame duck" period; inauguration moved to January 20. <b>21st</b> = repealed the 18th, so alcohol is legal again (1933). <b>22nd</b> = presidents limited to two terms, a reaction to FDR’s four.'},
  {name:'New Deal critics', terms:[['gd','Father Charles Coughlin'],['gd','Huey Long'],['gd','Court-Packing Scheme']],
   tip:'<b>Coughlin</b> = radio priest who supported FDR at first, then attacked the New Deal and wanted the banks nationalized. <b>Long</b> = said the New Deal didn’t go <i>far enough</i>: "Share Our Wealth." <b>Court-packing</b> = FDR’s plan to add pro-New Deal justices to the Supreme Court, which was rejected.'},
  {name:'Workers’ rights in the New Deal', terms:[['gd','Collective Bargaining'],['gd','Wagner Act'],['gd','Fair Labor Standards Act'],['gd','Frances Perkins']],
   tip:'<b>Collective bargaining</b> = workers negotiating as a group. <b>Wagner Act</b> = guarantees the right to unionize and bargain collectively. <b>Fair Labor Standards Act</b> = 40-hour week, minimum wage, overtime, and limits on child labor. <b>Perkins</b> = Secretary of Labor and the first woman in a president’s cabinet.'},
  {name:'Dawes Act vs. Indian Reorganization Act', terms:[['ga','Dawes (Severalty) Act'],['ga','Assimilation'],['gd','Indian Reorganization Act']],
   tip:'<b>Dawes Act</b> (1887, Gilded Age) = split up tribal land to push <b>assimilation</b>. The <b>Indian Reorganization Act</b> (New Deal) = <i>reversed</i> assimilation and strengthened the tribes and their cultures.'}
];
GROUPS.forEach(g => g.ids = g.terms.map(([u, name]) => UNIT[u].ids.find(id => TERMS[id].t === name)));

function startCompare(){
  session = null; Q = null; modeKeys = null;
  app.innerHTML = modeHeader('Compare', `${GROUPS.length} sets of easily confused terms`, `<p class="sub" style="margin:10px 0 0">Each set puts look-alike terms side by side with the key difference spelled out. Read it, then quiz yourself on just that set.</p>`) +
    `<div class="chunks">${GROUPS.map((g, i) => `<button class="mode" data-g="${i}"><b>${esc(g.name)}</b><span>${g.ids.map(id => esc(TERMS[id].t)).join(' · ')}</span></button>`).join('')}</div>`;
  $('back').onclick = goBack;
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => compareGroup(+b.dataset.g));
  window.scrollTo(0, 0);
}
function compareGroup(i){
  const g = GROUPS[i];
  app.innerHTML = modeHeader(g.name, 'Compare', '') +
    `<div class="tip"><div class="unit-num" style="margin-bottom:4px">The difference</div>${g.tip}</div>
    <div class="cmp">${g.ids.map(id => `<div class="c"><span class="u">${esc(UNIT[TERMS[id].unit].name)}</span><b>${esc(TERMS[id].t)}</b><p>${esc(TERMS[id].d)}</p></div>`).join('')}</div>
    <div class="btns" style="justify-content:center;margin-top:18px">
      <button id="quiz">Quiz me on these ${g.ids.length} →</button>
      ${i + 1 < GROUPS.length ? `<button class="secondary" id="nextG">Next set: ${esc(GROUPS[i + 1].name)}</button>` : ''}
      <button class="secondary" id="all">All sets</button></div>`;
  $('back').onclick = goBack;
  $('quiz').onclick = () => startDrill(g.ids, g.name, false, g.ids);
  if (i + 1 < GROUPS.length) $('nextG').onclick = () => compareGroup(i + 1);
  $('all').onclick = startCompare;
  window.scrollTo(0, 0);
}

const MODES = {
  flash:   {name:'Flashcards', scoped:true, start:startFlash, desc:'Flip through cards and sort them into "got it" or "still learning". The ones you\'re still learning come back until you know them.'},
  match:   {name:'Matching', scoped:true, start:startMatch, desc:'Match terms to definitions, six pairs per round, like the matching section on a test.'},
  tf:      {name:'True or False', scoped:true, start:startTF, desc:'Fast round: is this the right definition for this term? Wrong pairings come from look-alike terms in the same unit.'},
  compare: {name:'Compare', scoped:false, start:startCompare},
  era:     {name:'Which era?', scoped:false, start:startEra}
};
const MODE_TILES = [
  ['flash', 'Flashcards', 'Flip cards and sort them into got it / still learning.'],
  ['match', 'Matching', 'Pair terms with definitions, six at a time.'],
  ['tf', 'True or False', 'Speed round: does this definition fit this term?'],
  ['compare', 'Compare', 'Look-alike terms side by side, with the key difference explained.'],
  ['era', 'Which era?', 'Place each term in its unit to build the timeline.']
];

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (modeKeys) return modeKeys(e);
  if (!Q) return;
  if (/^[1-4]$/.test(e.key) && !Q.answered && Q.opts) {
    const b = document.querySelectorAll('.opt')[+e.key - 1];
    if (b) b.click();
  } else if (e.key === 'Enter' && Q.answered && e.target.id !== 'next') {
    e.preventDefault(); advance();
  }
});

$('totalTerms').textContent = ALL_IDS.length;
renderHome();
</script>
