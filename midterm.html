<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midterm Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1e6cd;--paper-dark:#e7d8b4;--card:#fffaf0;--white:#fffdf6;--ink:#2b2116;--ink-soft:#55452f;--brass:#a97c1f;--brass-deep:#7c5a13;--green:#3f5d3a;--green-bg:#dbe7d1;--red:#8f3a2e;--red-bg:#f0d9d2;--rule:#c9b587}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(ellipse at top left,rgba(169,124,31,.08),transparent 60%),var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:repeating-linear-gradient(transparent,transparent 27px,rgba(120,90,30,.06) 28px);pointer-events:none;z-index:0}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 80px;position:relative;z-index:1}
header.masthead{text-align:center;border-bottom:4px double var(--brass-deep);padding-bottom:18px;margin-bottom:22px}
.eyebrow,.tag,.mono{font-family:'Special Elite',monospace}
.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:12px;color:var(--brass-deep)}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(34px,6vw,54px);margin:6px 0 4px;letter-spacing:.5px}
h2,h3{font-family:'Playfair Display',serif;margin:0}
.sub{font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.5}
a.home-link{color:var(--brass-deep);font-size:13px}

.panel{background:rgba(255,250,240,.75);border:1px solid var(--rule);border-radius:10px;padding:20px}
.deck{background:var(--paper-dark);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:22px}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.stat-line{font-family:'Special Elite',monospace;font-size:13px;color:var(--ink-soft)}
.stat-line strong{color:var(--ink);font-size:15px}
.bar{width:100%;height:14px;background:var(--white);border:1px solid var(--rule);border-radius:999px;overflow:hidden;margin-top:10px}
.bar.thin{height:8px;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brass),var(--green));width:0;transition:width .35s ease}

button{font-family:'Lora',serif;font-weight:600;font-size:14px;border:1px solid var(--brass-deep);background:var(--brass);color:#fff9ec;padding:9px 16px;border-radius:6px;cursor:pointer;transition:background .15s,transform .06s}
button:hover:not(:disabled){background:var(--brass-deep)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:transparent;color:var(--ink);border-color:var(--ink-soft)}
button.secondary:hover:not(:disabled){background:rgba(0,0,0,.06)}
button.link{background:none;border:0;color:var(--brass-deep);padding:4px 0;text-decoration:underline;font-weight:500}
button.link:hover:not(:disabled){background:none;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass-deep);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.how{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--rule);border-radius:8px;font-size:14px;line-height:1.55;color:var(--ink-soft)}
.how b{color:var(--ink)}

.unit{margin-top:30px}
.unit-head{border-bottom:2px solid var(--brass);padding-bottom:8px;margin-bottom:12px;gap:10px}
.unit-head h2{font-size:24px}
.unit-num{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:2px;color:var(--brass-deep);text-transform:uppercase}
.chunks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chunk{background:rgba(255,250,240,.75);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.chunk.done{border-color:var(--green);background:rgba(219,231,209,.55)}
.chunk.next{border:2px solid var(--brass);box-shadow:0 2px 10px rgba(124,90,19,.18)}
.chunk h3{font-size:17px;line-height:1.25}
.chunk .meta{font-size:12.5px;color:var(--ink-soft);font-style:italic}
.chunk .btns{margin-top:6px}
.chunk .btns button{padding:7px 12px;font-size:13px}
.badge{font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:999px;align-self:flex-start}
.badge.next{background:var(--brass);color:#fff9ec}
.badge.done{background:var(--green);color:#fff}
.best{font-family:'Special Elite',monospace;font-size:12px;color:var(--ink-soft)}

.card{background:rgba(255,250,240,.8);border:1px solid var(--rule);border-radius:10px;padding:24px 22px 20px}
.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-deep);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--white)}
.prompt{font-size:18px;line-height:1.55;margin-bottom:20px}
.prompt.term{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(24px,4vw,32px);text-align:center;margin:10px 0 24px}
.ask{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:6px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{font-family:'Lora',serif;font-size:15px;font-weight:400;text-align:left;background:var(--white);border:2px solid var(--rule);color:var(--ink);padding:12px 14px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.opt .k{font-family:'Special Elite',monospace;color:var(--brass-deep);min-width:16px}
.opt:hover:not(:disabled){border-color:var(--brass);background:var(--paper-dark)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.opt.faded{opacity:.55}
input.type{width:100%;font:17px 'Lora',serif;padding:13px 14px;border:2px solid var(--rule);border-radius:8px;background:var(--white);color:var(--ink)}
input.type.correct{border-color:var(--green);background:var(--green-bg)}
input.type.wrong{border-color:var(--red);background:var(--red-bg)}
.feedback{margin-top:14px;font-size:15px;line-height:1.5;min-height:22px}
.feedback .good{color:var(--green);font-weight:600}
.feedback .bad{color:var(--red);font-weight:600}
.feedback .def{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-soft);font-style:italic}
.feedback .copy{display:block;margin-top:8px;padding:8px 10px;background:var(--paper-dark);border-radius:6px;font-size:13.5px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.hidden{display:none!important}
.keys{font-size:12px;color:var(--ink-soft);font-style:italic;text-align:center;margin-top:12px}

.center{text-align:center}
.big{font-family:'Playfair Display',serif;font-size:clamp(46px,10vw,72px);font-weight:800;line-height:1;margin:6px 0}
.list{text-align:left;border:1px dashed var(--rule);border-radius:8px;padding:6px 14px;margin:16px 0;max-height:420px;overflow-y:auto}
.list div{padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.45}
.list div:last-child{border-bottom:0}
.list .d{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
.breakdown div{background:var(--white);border:1px solid var(--rule);border-radius:8px;padding:10px;font-size:13px}
.breakdown b{display:block;font-size:20px;font-family:'Playfair Display',serif}
.study .item{padding:12px 0;border-bottom:1px solid var(--rule)}
.study .item:last-child{border-bottom:0}
.study .t{font-weight:700;font-size:16px}
.study .d{margin-top:4px;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:26px;font-style:italic}
@media(max-width:600px){.card{padding:20px 14px 16px}.prompt{font-size:16.5px}.panel{padding:16px 14px}}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <div class="eyebrow">U.S. History · Gilded Age → WWI</div>

</header>
<main id="app"></main>

<script>
const RAW = {"ga":[{"t":"Plessy v. Ferguson","d":"Supreme court case legalizing segregation (1896). Concluded separate but equal did not violate the 14th amendment. Legalized Jim Crow laws in the South."},{"t":"Jim Crow Laws","d":"Segregation ordinances in the South requiring people to be separate by race (restrooms, theaters, restaurants, etc.)"},{"t":"Grandfather Clause","d":"Allowed citizens to vote whose grandfather or father had voted…even if they could not pay the poll tax or pass the literacy test."},{"t":"Poll Tax","d":"Jim Crow voting law in the south. Goal was to keep African Americans from voting by making them pay a tax they could not afford to vote."},{"t":"Literacy Test","d":"Jim Crow voting law in the south. Goal was to keep African Americans from voting by making them pass a reading test before voting."},{"t":"Ida B. Wells","d":"Early Civil Rights activist who brought attention to the issue of lynching through investigative journalism."},{"t":"Booker T. Washington","d":"Early Civil Rights activist who believed African Americans should gain rights over time after gaining an education and becoming an important part of the economy. Gave the opinion in the so-called Atlanta Compromise speech in 1895."},{"t":"W.E.B. DuBois","d":"Black leader who believed African Americans should gain rights immediately. Was a founding member of the NAACP."},{"t":"Disenfranchisement","d":"Not having the right to vote or being kept from voting. (African Americans and women)"},{"t":"Sharecropping/Tenant Farming","d":"Post-Civil War labor system in which farmers cultivated a plot of land they did not own. Proceeds from the crop were split with the landowner. Led most to poverty."},{"t":"14th Amendment","d":"Added after the Civil War, it made all former slaves citizens and gave them equal protection and equal rights under the law."},{"t":"Reservation","d":"Lands west of the Mississippi River on which many Native Americans were forced to live during the 1800s. By grouping them together, the government hoped to force Natives to adopt Christianity and other white man's culture."},{"t":"Indian Wars","d":"Series of armed conflicts (1854-1890) between settlers and/or the U.S. army as a result of America expanding west and forcing Natives to abandon their land and culture."},{"t":"Assimilation","d":"This occurs when a country or people adopt another more dominant culture either by choice or by force."},{"t":"Dawes (Severalty) Act","d":"This 1887 law gave Native Americans a parcel of land. The idea was that Indians would produce food by farming rather than by hunting which required more land as areas were \"hunted out.\" The former tribal lands then went to settlers."},{"t":"Wounded Knee Massacre","d":"This 1890 battle was the last major conflict between the U.S. Army and Native Americans. Over 150 Native American men, women, and children were killed and 51 injured."},{"t":"Federal Land Grants","d":"Program in which the government provided loans and/or gave away millions of acres of federally owned property to railroad corporations to lay tracks across the country. Some land was used for rail routes, while the rest was sold to finance construction."},{"t":"Transcontinental Railroad","d":"Rail line built to connect the east and west coasts. Results in increased trade in the USA. Leads to creation of time zones."},{"t":"Eminent Domain","d":"The government's right to seize private property for public use provided it pays compensation to the landowner. Example: This sometimes aided railroad construction."},{"t":"Chinese Exclusion Act","d":"Law that prevented the immigration of persons from Asia's largest country for a period of ten years. Many of this ethnic group had worked on railroads in the western U.S. and native-born Americans feared the foreign workers would take their jobs when the rail jobs ended."},{"t":"Monopoly/Trust","d":"Term for when one company controls a specific industry; eliminates its competition."},{"t":"John Rockefeller","d":"He owned the Standard Oil monopoly. Used both vertical and horizontal integration."},{"t":"Bessemer Process","d":"Method used to create steel, cheaper and easier. Makes steel affordable; increases its use."},{"t":"Yellow-Dog contract","d":"Agreements workers were forced to sign stating they would not join a union."},{"t":"Vertical Integration","d":"Occurs when a company creates a monopoly by owning all the steps from raw materials, to manufacturing, to transportation, to sale of the end product."},{"t":"Nativism","d":"Favoring people born in the U.S. (native born Americans) over immigrants."},{"t":"Laissez-Faire Capitalism","d":"Little to no government intervention (hands off) in economic activities. This is the relationship between business and the U.S. government during the Gilded Age."},{"t":"Social Darwinism (Survival of the Fittest)","d":"The belief is that the strongest businesses and people come out on top. Nature decides who is successful and who isn't. Used to justify monopolistic practices; God supports it."},{"t":"Gospel of Wealth","d":"Article written by Andrew Carnegie. Puts forth the idea of the rich giving back to those with less by funding charitable causes. Used as a justification for monopolies."},{"t":"Alexander Graham Bell","d":"Inventor of the telephone. Use of new technology helps the American economy."},{"t":"Thomas Edison","d":"Invents light bulb and electrical power stations; revolutionizes the world."},{"t":"Knights of Labor","d":"Led by Terrence Powderly, it was the world's largest labor organization. But with a diverse membership (blacks, women, unskilled) and emphasis on broad topics such as a.) getting rid of child labor, and b.) outlawing monopolies, it ultimately failed."},{"t":"American Federation of Labor","d":"Successful labor union that focused on basic rights of workers such as a.) better pay, b.) safer working conditions, and c.) better hours. Led by Samuel Gompers. Still exists."},{"t":"Eugene V. Debs","d":"Union leader and head of the Socialist Party. Ran for president five times."},{"t":"Socialism","d":"A way of organizing a society in which major industries are owned and controlled by the government rather than by individual people and companies."},{"t":"Andrew Carnegie","d":"Owner of the monopoly that would become U.S. Steel. Gave 90% of fortune to charity."},{"t":"Cornelius Vanderbilt","d":"Founder of many railroads…especially in the northeast. Very wealthy."},{"t":"J.P. Morgan","d":"Banker who financed and/or oversaw some of the nation's largest corporate mergers including electric and steel corporations."},{"t":"Horizontal Integration","d":"Occurs when a company creates a monopoly by controlling one phase in the production or selling of a good. For example, Rockefeller controlling the oil business at the refinery level."},{"t":"Urbanization","d":"The term is used when people start moving from farms (rural areas) to cities to work in industrial jobs."},{"t":"Ethnic Neighborhood","d":"An area with a much higher concentration of a particular race or cultural group that is not the dominant group among the general population. Immigrants often move to these areas where others are like them and share their culture."},{"t":"Tenements","d":"Very inexpensively built apartments during the Gilded Age. Very dangerous, small, and unsanitary. Families often lived in one or two rooms with no windows."},{"t":"Settlement House","d":"Over 400 were created in major cities with the goal of helping immigrants find jobs, housing, and learn English. Jane Addams's Hull House in Chicago was the most famous. (Funded by private citizens because there was no government welfare then.)"},{"t":"Social Gospel Movement","d":"Members of this group believed it was the Christian responsibility of persons with money to help those affected by economic inequality, poverty, alcoholism, crime, racial tensions, slum life, child labor, and poor schools."},{"t":"Ellis Island","d":"Immigration inspection station on the east coast (New York City). Became a symbol of new opportunities in America."},{"t":"Anti-Saloon League","d":"Supported prohibition (making alcohol illegal). Its effort resulted in the 18th amendment passed during the Progressive Era. Often protested outside bars and taverns. One of its members, Cary Nation, went to saloons and busted beer kegs and bottles."},{"t":"Women's Christian Temperance Union (WCTU)","d":"This group used Christianity to push the agenda of prohibition. Many members were the wives, mothers, or daughters of men who drank too much and abused their families."},{"t":"Political Machine","d":"Political organizations during the Gilded Age. They gave immigrants jobs and housing in exchange for their votes. Corrupt! Goal is for the politicians and bosses to get rich, not govern."},{"t":"Party Boss","d":"Leader of a political machine. Controls votes and picks who will run for office. Very corrupt. Example: William Tweed/Tammany Hall NYC."},{"t":"Tariff","d":"Tax on imports. Goal is to protect American business from cheap, foreign-made products."},{"t":"Populist Party (Omaha Platform)","d":"Also called the peoples' party, it was mostly made up of poor farmers. Its platform called for an end to national banks, graduated income tax, direct election of U.S. Senators, civil service reform, 8-hr work day, government control of important industries and bimetallism / free silver."},{"t":"Bimetallism (Free Silver)","d":"Populist goal to increase the money supply by switching the U.S. off the gold standard. Wanted to base money in circulation off both gold and silver. Critics disliked the plan because an increase in money supply would cause inflation. Farmers believed a little inflation was good."},{"t":"Gold Standard","d":"Basing money off the amount of gold the U.S. has in reserve. Keeps inflation down, but limits the amount of money in circulation because banks have less money to loan."},{"t":"William Jennings Bryan","d":"Leader of the Populist party. Ran for president twice and lost. Gave Cross of Gold Speech."},{"t":"Cross of Gold Speech","d":"Given in support of taking America off the gold standard. Believed the gold standard kept workers poor and made industrialists/monopolists rich at the expense of workers."},{"t":"Grange Movement","d":"Group formed to fight the monopolistic practices of railroads and grain elevators. They fought successfully for states to pass laws to regulate rail and storage facilities."},{"t":"Interstate Commerce Act","d":"Federal law which required railroad rates to be \"reasonable and just.\" However, it did not empower the government to fix specific rates."},{"t":"Farmers' Alliance","d":"Farmer's rights movement created after the Grange Movement. Goal was to improve the economic standing of farmers through regulation and increase in money supply. Made up of white and black farmers. Leads to the creation of the Populist Party."},{"t":"National American Woman Suffrage Association","d":"Women's rights organization. Its goal was to get women the right to vote. Lead by Susan B. Anthony, Carrie Chapman Catt, and Anna Howard Shaw."},{"t":"Wabash v. Illinois","d":"Supreme Court case that ruled states could not regulate railroads. The decision stated that transportation across state lines could only be regulated by the federal government."},{"t":"Panic of 1893","d":"A stock market collapse led to 20% unemployment, soup kitchens, and hobos. However, President Cleveland took a \"hands off\" approach to the crisis and let it run its course."},{"t":"Sherman Antitrust Act","d":"Federal law making trusts/monopolies that limit competition illegal. Increases the power of the federal government and attempts to take power away from monopolies."},{"t":"Pendleton Civil Service Act","d":"Federal law/regulation requiring government jobs be given on merit. Goal was to end corruption, graft, and make the government work better; and power of political machines."}],"imp":[{"t":"Alaska Purchase (1867)","d":"Also called Seward's Folly. Bought from Russia for $7.2 million. Discovery of natural resources like gold and oil proved the purchase was wise."},{"t":"Alfred T. Mahan","d":"U.S. Navy officer who believed the U.S. needed to expand its Navy to increase its size and power around the world."},{"t":"Yellow Journalism","d":"Newspaper articles that are untruthful with the goal of selling papers. They are presently called tabloids. A leading cause of the Spanish-American War."},{"t":"Spanish-American War","d":"Also called the “Splendid Little War.” In 1898 it lasted 3 months. America vs. Spain. America wins and becomes a world power. Takes control of Cuba for 2 years. The U.S. gains the Philippines, Guam, and Puerto Rico."},{"t":"USS Maine","d":"U.S. Navy ship exploded in Havana harbor. Yellow journalists and American politicians blamed Spain and used it as a reason for the Spanish-American War."},{"t":"Theodore Roosevelt","d":"Republican President from 1901–09. McKinley’s Vice President. Became president after McKinley was assassinated. Considered the first modern president. Built the Panama Canal and believed in the Roosevelt Corollary. Led the Rough Riders at the Battle of San Juan Hill."},{"t":"Rough Riders","d":"Volunteer Cavalry unit led by Teddy Roosevelt during the Spanish-American War."},{"t":"Annexation of Hawaii (1898)","d":"In 1898 Hawaii became part of the United States for economic and military reasons."},{"t":"Puerto Rico","d":"Became part of the U.S. empire following the Spanish-American War."},{"t":"Anti-Imperialist League","d":"Group of Americans who did not support imperialism. They believed imperialism went against the ideals the country was founded on in the Constitution."},{"t":"Platt Amendment","d":"Allowed Cuba to be free from American rule following the Spanish-American War. Allowed the U.S. to intervene in Cuban affairs and gave the U.S. Guantanamo Bay military base."},{"t":"Sphere of Influence","d":"A territorial area over which political or economic influence is wielded by one nation."},{"t":"Open Door Policy","d":"U.S. policy in China calling for free trade in the country. The U.S. wanted no spheres of influence in China."},{"t":"Boxer Rebellion","d":"Violent anti-foreigner movement in China from 1899–1901. Many Chinese had grown tired of foreign imperialism and Christian missionaries."},{"t":"Big Stick Policy","d":"Teddy Roosevelt’s foreign policy. The idea was to negotiate peacefully but with the threat of military force to ensure positive results."},{"t":"Panama Canal","d":"Built through the isthmus of Panama. Allowed quicker shipping by connecting the Pacific and Atlantic Oceans. Teddy Roosevelt negotiated its building by helping the Panamanians gain independence from Colombia."},{"t":"Gentlemen’s Agreement","d":"Agreement between the USA and Japan. Japan agreed to stop emigration to the U.S. of non-skilled workers. The U.S. agreed to end segregation laws aimed at the Japanese."},{"t":"Roosevelt Corollary","d":"Added to the Monroe Doctrine. The U.S. would intervene in conflicts between Europe and Latin America. It reflected the idea that the U.S. had become the world’s police."},{"t":"Dollar Diplomacy","d":"Foreign policy of Howard Taft. The U.S. government encouraged investment in foreign countries to increase trade."},{"t":"Moral Diplomacy","d":"Foreign policy of Woodrow Wilson. Stated the U.S. would only support countries who had the same economic and democratic beliefs as the USA. Wanted to spread democracy and capitalism."},{"t":"Teller Amendment","d":"Passed after President McKinley’s Spanish-American War message. It stated the U.S. could go to war in Cuba but could not annex the island after the war."},{"t":"Imperialism","d":"Economic, military, and/or cultural influence of one country over other countries."}],"prog":[{"t":"Progressive Movement","d":"Goal was to fix the problems created in the Gilded Age. Wanted government to listen to citizens, labor reforms, and social reforms."},{"t":"Scientific Management","d":"Progressives wanted to increase productivity and efficiency with science."},{"t":"Muckrakers","d":"Investigative journalists who exposed the problems of the Gilded Age. They also provided solutions to the problems."},{"t":"16th Amendment","d":"Ratified in 1913; allows Congress to impose a graduated income tax. The more you make, the more you pay."},{"t":"Jacob Riis","d":"A muckraker who used photography and writing to expose the living and working conditions of those in poverty."},{"t":"Australian (Secret) Ballot","d":"When voters mark their choices in private. This idea was pushed by the Populist Party and adopted by Progressives."},{"t":"Direct Primary","d":"A Progressive reform when voters choose who will run for office, not the party or political machine. Goal was to end corruption in politics."},{"t":"Robert La Follette","d":"Progressive Governor and Senator from Wisconsin. Led Wisconsin as the first state to adopt many Progressive reforms. Many aimed at giving citizens a bigger role in government."},{"t":"17th Amendment","d":"Allowed the direct election of U.S. Senators. Goal was to make government more responsive to citizens instead of monopolies/trusts and political machines."},{"t":"Initiative","d":"Voter-driven petition to change a law. Led by progressive reforms to make government more responsive to citizens."},{"t":"Referendum","d":"A public vote on proposed legislation. A progressive reform aimed at giving voters a bigger voice in government."},{"t":"Recall","d":"Allows voters the opportunity to remove an elected official by having another election before their term is up. Must be started by voters through petitions."},{"t":"Social Welfare","d":"Things that impact the good of the people. Often refers to services provided by the government for the people."},{"t":"Municipal Reform","d":"Changing city government so it is more efficient, honest, and responsive."},{"t":"Teddy Roosevelt","d":"Republican Progressive Era President 1901–1909. Also ran for the Bull Moose Party in 1912, helping split the Republican vote. Known for trust busting, conservation, and Big Stick Policy. Considered the first modern president due to his use of the media."},{"t":"Square Deal","d":"Teddy Roosevelt's domestic programs. Goals included conservation, regulating big business, and protecting consumers."},{"t":"Trust Busting","d":"Teddy Roosevelt, Howard Taft, and Woodrow Wilson used the Sherman Anti-Trust Act to break up trusts/monopolies because they discouraged competition and hurt consumers."},{"t":"Elkins Act","d":"A federal law allowing the Interstate Commerce Commission the power to fine railroads that gave unfair rebates or discriminated with unfair pricing."},{"t":"The Jungle","d":"Muckraking book written by Upton Sinclair. The fictional book depicts actual conditions inside meatpacking plants and made people aware of unsanitary conditions."},{"t":"Pure Food and Drug Act (1906)","d":"Requires truth in labeling of goods sold in the USA. Companies could no longer claim their product did things it did not do."},{"t":"Meat Inspection Act (1906)","d":"Created as a reaction to The Jungle. Required sanitary conditions in meatpacking facilities."},{"t":"Conservation","d":"Preserving or protecting something with the goal of keeping it in its natural state."},{"t":"William Howard Taft","d":"President Roosevelt's hand-picked successor. Republican President 1909–1913. Angered Teddy Roosevelt and other Republicans because he did not copy Teddy's presidency and decreased conservation efforts. Only former president to become Chief Justice of the Supreme Court."},{"t":"18th Amendment","d":"Ratified in 1919; prohibited commercial manufacture, sale, and consumption of alcoholic beverages."},{"t":"Payne-Aldrich Tariff","d":"Passed during Taft's presidency. Increased tariffs, which upset members of his party and led to Taft losing Teddy Roosevelt's support."},{"t":"Eugene V. Debs","d":"American union leader and head of the Socialist Party. Ran for Pr const norm = s => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');
const digits = s => s.replace(/\D/g, '');
const acceptCache = {};
function accepted(term){
  if (acceptCache[term]) return acceptCache[term];
  const set = new Set();
  const add = s => {
    s = s.trim(); if (!s) return;
    const noThe = s.replace(/^the\s+/i, '');
    set.add(norm(s)); set.add(norm(noThe));
    const noSuffix = noThe.replace(/\s+(policy|movement|speech|laws|act|party)$/i, '');
    if (noSuffix !== noThe && norm(noSuffix).length >= 4) set.add(norm(noSuffix));
  };
  add(term);
  const base = term.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ');
  add(base);
  const paren = term.match(/\(([^)]+)\)\s*$/);
  if (paren && !/^\d+$/.test(paren[1])) add(paren[1]);
  [term, base].forEach(s => { if (s.includes('/')) s.split('/').forEach(add); });
  (ALIASES[term] || []).forEach(add);
  set.delete('');
  return acceptCache[term] = [...set];
}
function lev(a, b){
  const m = a.length, n = b.length; let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function isMatch(input, term){
  const n = norm(input); if (!n) return false;
  return accepted(term).some(a => {
    if (a === n) return true;
    if (digits(a) !== digits(n)) return false; // never let 16th pass for 17th
    const tol = a.length >= 12 ? 2 : a.length >= 5 ? 1 : 0;
    return lev(a, n) <= tol;
  });
}

function distractors(id, n){
  const t = TERMS[id];
  const chunkMates = shuffle(CHUNKS[t.chunk].ids.filter(x => x !== id)).slice(0, 2);
  const unitMates = shuffle(UNIT[t.unit].ids.filter(x => x !== id && !chunkMates.includes(x)));
  return chunkMates.concat(unitMates).slice(0, n);
}
function makeQ(id, kind){
  const q = {id, kind, answered:false, ok:false, given:null, mustCopy:false};
  if (kind !== 'type') q.opts = shuffle([id, ...distractors(id, 3)]);
  return q;
}

function answerTyped(gaveUp){
  if (Q.answered) return;
  const inp = $('typeIn'), val = inp.value, t = TERMS[Q.id];
  if (!gaveUp && !val.trim()) { inp.focus(); return; }
  Q.answered = true; Q.given = val; Q.ok = !gaveUp && isMatch(val, t.t);
  if (Q.ok) {
    inp.classList.add('correct'); inp.disabled = true;
    $('fb').innerHTML = '<span class="good">✓ Correct.</span>' + (norm(val) !== norm(t.t) ? ` Official term: <b>${esc(t.t)}</b>` : '');
    showNext();
    return;
  }
  inp.classList.add('wrong');
  let html = `<span class="bad">✗ ${gaveUp ? 'Here it is.' : 'Not quite.'}</span> The answer is <b>${esc(t.t)}</b>.`;
  if (session.type === 'drill') {
    // Make them write it out once so the miss actually sticks.
    Q.mustCopy = true;
    html += `<span class="copy">Type <b>${esc(t.t)}</b> in the box to lock it in and continue.</span>`;

    $('idk').classList.add('hidden'); $('submit').textContent = 'Lock it in';

    showNext();
  }
  $('fb').innerHTML = html;
  if (!gaveUp) $('override').classList.remove('hidden');
}

function onTypeEnter(){
  if (!Q.answered) return answerTyped(false);
  if (Q.mustCopy) {
    const inp = $('typeIn');
    if (isMatch(inp.value, TERMS[Q.id].t)) { Q.mustCopy = false; inp.disabled = true; inp.classList.remove('wrong'); inp.classList.add('correct'); showNext(); }
    else { inp.classList.add('wrong'); inp.select(); }
    return;
  }
  advance();
}

function advance(){
  if (!Q || !Q.answered || Q.mustCopy) return;
  session.type === 'drill' ? drillCommit(Q.ok) : examCommit(Q.ok);
}

function startDrill(ids, title, persist, backTo){
  const lv = {};
  ids.forEach(id => lv[id] = persist ? lvl(id) : 0);
  session = {type:'drill', title, ids, persist, lv, right:0, wrong:0, missed:new Set(), backTo: backTo || 'home',
             queue: shuffle(ids.filter(id => lv[id] < MASTER))};
  nextDrill();
}
function setLv(id, v){ session.lv[id] = v; if (session.persist) { S.lv[id] = v; save(); } }
function nextDrill(){
  const s = session;
  if (!s.queue.length) return drillDone();
  const id = s.queue.shift();
  Q = makeQ(id, s.lv[id] >= 1 ? 'type' : 'mc');
  const done = s.ids.filter(x => s.lv[x] >= MASTER).length;
  const steps = s.ids.reduce((a, x) => a + Math.min(MASTER, s.lv[x]), 0);
  app.innerHTML = `<div class="deck">
    <div class="row"><h2 style="font-size:20px">${esc(s.title)}</h2><button class="secondary" id="back">← Menu</button></div>
    <div class="row stat-line" style="margin-top:8px"><span>Mastered: <strong>${done}</strong> / ${s.ids.length}</span><span>✓ ${s.right} &nbsp; ✗ ${s.wrong}</span></div>
    <div class="bar"><div style="width:${pct(steps, s.ids.length * MASTER)}%"></div></div>
  </div><div id="qArea"></div>
  <div class="keys">Each term: pick it from choices, then type it from memory. Miss either one and it starts over.</div>`;
  $('back').onclick = goBack;
  renderQuestion();
}
function drillCommit(ok){
  const s = session, id = Q.id;
  if (ok) { s.right++; setLv(id, s.lv[id] + 1); }
  else {
    s.wrong++; s.missed.add(id); setLv(id, 0);
    S.miss[id] = (S.miss[id] || 0) + 1; save();
  }
  if (s.lv[id] < MASTER) {
    // Missed terms come back fast; half-learned ones come back a little later.
    const len = s.queue.length;
    const pos = ok ? Math.min(len, 3 + Math.floor(Math.random() * 4)) : Math.min(len, 2 + Math.floor(Math.random() * 2));
    s.queue.splice(pos, 0, id);
  }
  nextDrill();
}
function drillDone(){
  const s = session, total = s.right + s.wrong;
  const missed = [...s.missed];
  const nextChunk = s.persist ? CHUNKS.find(c => c.ids.some(id => lvl(id) < MASTER)) : null;
  app.innerHTML = `<div class="panel center">
    <div class="eyebrow">Chunk complete</div>
    <h2 style="font-size:28px;margin:8px 0">${esc(s.title)} — mastered</h2>
    <p class="sub">${total ? pct(s.right, total) + '% first-try accuracy this session (' + s.right + ' / ' + total + ')' : 'Already mastered.'}</p>
    ${missed.length ? `<p style="margin-bottom:0">These tripped you up — look them over once more:</p>
      <div class="list">${missed.map(id => `<div><b>${esc(TERMS[id].t)}</b><span class="d">${esc(TERMS[id].d)}</span></div>`).join('')}</div>` : '<p>No misses. Clean.</p>'}
    <div class="btns" style="justify-content:center;margin-top:10px">
      ${nextChunk ? `<button id="nextChunk">Next chunk: ${esc(nextChunk.name)} →</button>` : ''}
      <button class="secondary" id="menu">Menu</button>
    </div></div>`;
  if (nextChunk) $('nextChunk').onclick = () => drillChunk(nextChunk.idx);
  $('menu').onclick = goBack;
  Q = null;
}
function drillChunk(i){ const c = CHUNKS[i]; startDrill(c.ids, c.name, true); }

// ---------- EXAM ----------
function examKind(){ const r = Math.random(); return r < .55 ? 'mc' : r < .75 ? 'rev' : 'type'; }
function startExam(scope, ids, title){
  session = {type:'exam', scope, title, list: shuffle(ids).map(id => ({id, kind: examKind()})), i:0, results:[]};
  nextExam();
}
function nextExam(){
  const s = session;
  if (s.i >= s.list.length) return examDone();
  const item = s.list[s.i];
  Q = makeQ(item.id, item.kind);
  const right = s.results.filter(r => r.ok).length;
  app.innerHTML = `<div class="deck">
    <div class="row"><h2 style="font-size:20px">${esc(s.title)}</h2><button class="secondary" id="back">Quit exam</button></div>
    <div class="row stat-line" style="margin-top:8px"><span>Question <strong>${s.i + 1}</strong> / ${s.list.length}</span><span>Score so far: <strong>${right}</strong> / ${s.results.length}</span></div>
    <div class="bar"><div style="width:${pct(s.i, s.list.length)}%"></div></div>
  </div><div id="qArea"></div>
  <div class="keys">One shot per question. Mix of term → definition, definition → term, and typed answers.</div>`;
  $('back').onclick = () => { if (confirm('Quit this exam? Your score will not be saved.')) goBack(); };
  renderQuestion();
}
function examCommit(ok){
  const s = session;
  s.results.push({id: Q.id, ok});
  if (!ok) { S.miss[Q.id] = (S.miss[Q.id] || 0) + 1; save(); }
  s.i++;
  nextExam();
}
function examDone(){
  const s = session, n = s.results.length, right = s.results.filter(r => r.ok).length, p = pct(right, n);
  const prevBest = S.best[s.scope];
  if (prevBest === undefined || p > prevBest) { S.best[s.scope] = p; save(); }
  const missed = s.results.filter(r => !r.ok).map(r => r.id);
  const msg = p === 100 ? 'Perfect. That\'s the 100.' : p >= 93 ? 'So close — drill the misses and retake.' : p >= 80 ? 'Solid, but not there yet. Drill the misses.' : 'Go back through the chunks you missed, then retake.';
  const units = UNITS.filter(u => s.results.some(r => TERMS[r.id].unit === u.key));
  app.innerHTML = `<div class="panel center">
    <div class="eyebrow">${esc(s.title)} · results</div>
    <div class="big">${p}%</div>
    <p class="sub" style="margin:0">${right} / ${n} correct${prevBest !== undefined ? ' · previous best ' + prevBest + '%' : ''}</p>
    <p style="font-weight:600">${msg}</p>
    ${units.length > 1 ? `<div class="breakdown">${units.map(u => { const rs = s.results.filter(r => TERMS[r.id].unit === u.key), ok = rs.filter(r => r.ok).length; return `<div><b>${pct(ok, rs.length)}%</b>${esc(u.name)}<br>${ok} / ${rs.length}</div>`; }).join('')}</div>` : ''}
    ${missed.length ? `<p style="margin-bottom:0;text-align:left"><b>Missed (${missed.length}):</b></p>
      <div class="list">${missed.map(id => `<div><b>${esc(TERMS[id].t)}</b><span class="d">${esc(TERMS[id].d)}</span></div>`).join('')}</div>` : ''}
    <div class="btns" style="justify-content:center;margin-top:10px">
      ${missed.length ? '<button id="drillMissed">Drill my misses →</button>' : ''}
      <button class="secondary" id="retake">Retake</button>
      <button class="secondary" id="menu">Menu</button>
    </div></div>`;
  if (missed.length) $('drillMissed').onclick = () => startDrill(missed, 'Exam misses', false);
  const again = {scope: s.scope, ids: s.list.map(x => x.id), title: s.title};
  $('retake').onclick = () => startExam(again.scope, again.ids, again.title);
  $('menu').onclick = goBack;
  Q = null;
}

// ---------- STUDY LIST ----------
function studyChunk(i){
  const c = CHUNKS[i];
  session = null; Q = null;
  app.innerHTML = `<div class="deck"><div class="row"><div><div class="unit-num">${esc(UNIT[c.unit].name)}</div><h2 style="font-size:22px">${esc(c.name)}</h2></div>
    <div class="btns"><button id="go">Drill this chunk →</button><button class="secondary" id="back">← Menu</button></div></div></div>
    <div class="panel study">${c.ids.map(id => `<div class="item"><div class="t">${esc(TERMS[id].t)}</div><div class="d">${esc(TERMS[id].d)}</div></div>`).join('')}</div>`;
  $('go').onclick = () => drillChunk(i);
  $('back').onclick = goBack;
  window.scrollTo(0, 0);
}

// ---------- HOME ----------
function goBack(){ session = null; Q = null; renderHome(); }
function renderHome(){
  const mastered = ALL_IDS.filter(id => lvl(id) >= MASTER).length;
  const steps = ALL_IDS.reduce((a, id) => a + Math.min(MASTER, lvl(id)), 0);
  const nextChunk = CHUNKS.find(c => c.ids.some(id => lvl(id) < MASTER));
  const weak = ALL_IDS.filter(id => S.miss[id]).sort((a, b) => S.miss[b] - S.miss[a]).slice(0, 20);
  const best = k => S.best[k] !== undefined ? `<span class="best">best ${S.best[k]}%</span>` : '';
  app.innerHTML = `
  <div class="deck">
    <div class="row stat-line"><span>Terms mastered: <strong>${mastered}</strong> / ${ALL_IDS.length}</span><span>${pct(steps, ALL_IDS.length * MASTER)}% of the way there</span></div>
    <div class="bar"><div style="width:${pct(steps, ALL_IDS.length * MASTER)}%"></div></div>
    <div class="btns" style="margin-top:14px">
      ${nextChunk ? `<button id="continue">${steps ? 'Continue' : 'Start'}: ${esc(nextChunk.name)} →</button>` : ''}
      <button id="final" ${nextChunk ? 'class="secondary"' : ''}>Full midterm exam (${ALL_IDS.length})</button>
      <button class="secondary" id="quick">Quick 25 mix</button>
      <button class="secondary" id="weak" ${weak.length ? '' : 'disabled'}>Weak spots${weak.length ? ' (' + weak.length + ')' : ''}</button>
    </div>
    <div class="row" style="margin-top:8px">${best('all')}<button class="link" id="reset">Reset all progress</button></div>
    <div class="how"><b>How to get the 100:</b> Work each chunk until it says mastered — every term has to be picked from choices <i>and</i> typed from memory, and a miss sends it back to the start. After a unit is done, take its unit test. When all ${CHUNKS.length} chunks are green, take the full midterm exam until you hit 100%, then use <i>Weak spots</i> for anything that keeps slipping.</div>
  </div>
  ${UNITS.map((u, ui) => {
    const um = u.ids.filter(id => lvl(id) >= MASTER).length;
    return `<section class="unit">
      <div class="row unit-head"><div><div class="unit-num">Unit ${ui + 1} · ${um} / ${u.ids.length} mastered</div><h2>${esc(u.name)}</h2></div>
        <div class="btns" style="align-items:center">${best(u.key)}<button class="secondary" data-unit="${u.key}">Unit test (${u.ids.length})</button></div></div>
      <div class="chunks">${u.chunks.map(c => {
        const cs = c.ids.reduce((a, id) => a + Math.min(MASTER, lvl(id)), 0);
        const cm = c.ids.filter(id => lvl(id) >= MASTER).length;
        const done = cm === c.ids.length, isNext = nextChunk && nextChunk.idx === c.idx;
        return `<div class="chunk ${done ? 'done' : ''} ${isNext ? 'next' : ''}">
          ${done ? '<span class="badge done">✓ Mastered</span>' : isNext ? '<span class="badge next">Up next</span>' : ''}
          <h3>${esc(c.name)}</h3>
          <div class="meta">${plural(c.ids.length, 'term')} · ${cm} mastered</div>
          <div class="bar thin"><div style="width:${pct(cs, c.ids.length * MASTER)}%"></div></div>
          <div class="btns">
            <button data-drill="${c.idx}" ${done ? 'class="secondary"' : ''}>${done ? 'Redo' : cs ? 'Continue' : 'Drill'}</button>
            <button class="secondary" data-study="${c.idx}">Study list</button>
          </div></div>`;
      }).join('')}</div></section>`;
  }).join('')}`;
  if (nextChunk) $('continue').onclick = () => drillChunk(nextChunk.idx);
  $('final').onclick = () => startExam('all', ALL_IDS, 'Full Midterm Exam');
  $('quick').onclick = () => startExam('quick', shuffle(ALL_IDS).slice(0, 25), 'Quick 25 Mix');
  if (weak.length) $('weak').onclick = () => startDrill(weak, 'Weak spots', false);
  $('reset').onclick = () => { if (confirm('Erase all mastery progress and best scores on this device?')) { S = {lv:{}, miss:{}, best:{}}; save(); renderHome(); } };
  document.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => startExam(b.dataset.unit, UNIT[b.dataset.unit].ids, UNIT[b.dataset.unit].name + ' — Unit Test'));
  document.querySelectorAll('[data-drill]').forEach(b => b.onclick = () => {
    const c = CHUNKS[+b.dataset.drill];
    if (c.ids.every(id => lvl(id) >= MASTER)) { c.ids.forEach(id => S.lv[id] = 0); save(); }
    drillChunk(c.idx);
  });
  document.querySelectorAll('[data-study]').forEach(b => b.onclick = () => studyChunk(+b.dataset.study));
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if (!Q || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key) && !Q.answered && Q.opts) {
    const b = document.querySelectorAll('.opt')[+e.key - 1];
    if (b) b.click();
  } else if (e.key === 'Enter' && Q.answered && e.target.id !== 'next') {
    e.preventDefault(); advance();
  }
});

renderHome();
</script>
</body>
